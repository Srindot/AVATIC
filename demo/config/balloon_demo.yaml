# WORKSHOP DEMO (pluto_x_demo.balloon_demo:BalloonDemoController)
# Hand-planned route through KNOWN balloon positions using ground truth -
# not a challenge solution (teams must use the camera).
#
# Balloons (pluto_x_gazebo config/arena_default.yaml, index: colour, points,
# ENU position):
#   0 yellow 25 ( 1.5,  0.5, 1.0)    4 red  -75 ( 0.5,  2.8, 1.4)  PENALTY
#   1 yellow 25 (-1.2,  1.0, 0.9)    5 red  -75 (-2.8, -0.6, 1.5)  PENALTY
#   2 blue   50 ( 2.2, -1.2, 1.3)    6 green 100 ( 3.6,  1.8, 1.8)
#   3 blue   50 (-0.8, -2.0, 1.1)    7 green 100 (-2.4, -3.0, 1.9)
# The drone starts at the origin facing +x (east). ~4 s of the run go to
# the firmware start-up. balloon_demo.launch.py runs the demo for 35 s
# (time_limit_s). RED BALLOONS ARE PENALTIES (-75): the route visits the
# six others (350 points, the best achievable) in the shortest order,
# 17.5 m and ~385 deg of turning, and every leg passes at least 1.08 m from
# both red balloons (red 4 and red 5 are obstacles, not targets).
# For the 15 s competition length use demo/config/balloon_demo_15s.yaml.
arena_config: ''          # '' = pluto_x_gazebo config/arena_default.yaml
route: [0, 6, 2, 3, 7, 1]   # yellow, green, blue, blue, green, yellow (no red)
takeoff_height_m: 0.5     # climb straight up first (no tilt/yaw on the ground)
face_tolerance_deg: 20.0  # start the approach once the nose is this close
pop_distance_m: 0.20      # next balloon inside this distance of the centre: contact is
                          # certain there (0.15 m balloon radius + 0.07 m drone sphere)

# WaypointController loops, faster than the defaults for the demo
max_speed_m_s: 1.5
max_tilt_deg: 25.0
kp_position_1_s: 1.5
max_climb_m_s: 0.8
max_yaw_rate_deg_s: 70.0  # firmware limit ~77 deg/s at full stick
kp_yaw_1_s: 3.0
