# Pluto X — ESTIMATED vehicle configuration (legacy controller structure).
#
# STATUS: best available estimate, NOT measured. No official datasheet gives
# mass properties, geometry or thrust. Every value is tagged:
#   [SRC]  published by the manufacturer / a retailer / a component datasheet
#   [EST]  estimated from [SRC] values and physics (derivation in
#          docs/pluto_x_parameters.md)
#   [CTRL] controller design value (legacy gains rescaled, not tuned)
# Replace [EST] values with measurements as they become available; see the
# measurement plan in docs/pluto_x_parameters.md.
#
# FRAMES / UNITS: as in legacy_kwad.yaml (NED/FRD, SI).

vehicle:
  # [SRC] ~60 g drone (Drone Deliver review, store listing) + 8 g Pluto WiFi
  # camera module with casing (supplier spec) = 68 g flying with the camera.
  mass_kg: 0.068
  gravity_m_s2: 9.81               # must equal the Gazebo world gravity
  inertia_kg_m2:                   # [EST] component model incl. camera, docs §3
    xx: 0.000058
    yy: 0.000063
    zz: 0.000111
  rotor_inertia_kg_m2: 0.00000004  # [EST] 55 mm prop ~0.35 g + coreless rotor;
                                   #       >= 6e-8 destabilises the MagisV2 yaw
                                   #       loop (docs §4)
  # CoM to motor axis: motors at (+-46, +-46) mm. [SRC] 10 x 10 cm frame
  # (parts listing), 16 x 16 cm overall with 55 mm props and guards (dealer
  # listing), legacy CAD motors at +-46 mm. (Was 0.045 until 2026-09-24:
  # "90 mm frame" misread as the motor-to-motor diagonal.)
  arm_length_m: 0.065
  legacy_double_arm_torque: false  # physically consistent torque
  legacy_gyroscopic_form: false    # physical rotor-momentum term
  drag:
    # Rotor drag (in-plane, proportional to summed rotor speed) + quadratic
    # body drag. With the motors off only body drag acts, so a falling
    # vehicle is close to free fall (docs/pluto_x_parameters.md §5).
    model: rotor_and_body
    linear_ned_n_s_m: {north: 0.0, east: 0.0, down: 0.0}   # legacy model only
    # [EST] 0.08 N per m/s of horizontal air speed at hover:
    #   0.08 / (4 x 3132 rad/s hover rotor speed) = 6.4e-6
    rotor_drag_coefficient_n_s_m_rad: 0.0000064
    body_drag_area_frd_m2:         # [EST] Cd x A per body axis
      x: 0.0044                    #   ~0.10 x 0.03 m side + guards, Cd ~1.1
      y: 0.0044
      z: 0.0096                    #   ~0.08 m^2-equivalent top, Cd ~1.2
    air_density_kg_m3: 1.225       # ISA sea level

rotor:
  layout: magis_quad_x             # [SRC] MagisV2 mixerQuadX, M0..M3
  time_constant_s: 0.03            # [EST] coreless 720 + 55 mm prop spin-up
  spin_up_reaction_torque: true    # yaw reaction of accelerating rotors
  thrust_coefficient_n_s2: 1.5e-8  # [EST] T = kt w^2, docs §4
  yaw_drag_coefficient_n_m_s2: 2.4e-10  # [EST] Q/T = 0.016 m
  speed_squared_min_rad2_s2: 0.0
  # [EST] w_max = 4163 rad/s (39,750 rpm, loaded; 720 motor no-load rating
  # 45-50k rpm [SRC]) -> T_max = 0.26 N per rotor, 1.04 N total (T/W 1.77).
  speed_squared_max_rad2_s2: 17333333.0

actuation_limits:
  thrust_n:
    min: 0.0
    max: 1.04                      # [EST] 4 x 0.26 N
  torque_n_m:                      # [EST] two rotors at T_max, two at 0
    roll: 0.02392                  #   2 * 0.26 N * 0.046 m
    pitch: 0.02392
    yaw: 0.00832                   #   2 * kd * w_max^2

controller:
  period_s: 0.01                   # [CTRL] legacy 100 Hz (MagisV2 runs ~285 Hz)
  position:
    error_frame: yaw_only          # see legacy_kwad.yaml / docs/legacy_port.md
    # [CTRL] north/east output angles: legacy gains unchanged.
    north: {kp: 0.35, ki: 0.25, kd: -0.35, integral_window: 0.25}
    east:  {kp: 0.35, ki: 0.25, kd: -0.35, integral_window: 0.25}
    # [CTRL] down outputs newtons: legacy gains x (0.068 / 1.4)
    down:  {kp: 0.2856, ki: 0.0, kd: -0.24529, integral_window: 0.25}
    roll_limit_rad: 0.7853
    pitch_limit_rad: 0.7853
  attitude:                        # [CTRL] outputs rad/s: legacy unchanged
    roll:  {kp: 4.5, ki: 0.0, kd: 0.0, integral_window: 0.0349}
    pitch: {kp: 4.5, ki: 0.0, kd: 0.0, integral_window: 0.0349}
    yaw:   {kp: 4.5, ki: 0.0, kd: 0.0, integral_window: 0.1396}
    body_rate_limit_rad_s: {roll: 0.87266, pitch: 0.87266, yaw: 0.87266}
  rate:
    # [CTRL] outputs N m. Legacy gains x (J_new / J_legacy) with the legacy
    # effective torque arm (0.56) folded in, so that the closed-loop rate
    # dynamics (angular acceleration per rad/s of error) are unchanged:
    #   roll:  x 5.8e-5 / (0.05 / 0.56) = 6.496e-4
    #   pitch: x 6.3e-5 / (0.05 / 0.56) = 7.056e-4
    #   yaw:   x 1.11e-4 / 0.24         = 4.625e-4 (legacy jz)
    roll:  {kp: 0.00175392, ki: 0.00064960, kd: -0.0000064960, integral_window: 0.174532}
    pitch: {kp: 0.00190512, ki: 0.00070560, kd: -0.0000070560, integral_window: 0.174532}
    yaw:   {kp: 0.00124875, ki: 0.00046250, kd: -0.0000046250, integral_window: 0.174532}

pilot:
  # position_hold (fly to the target) or manual_attitude (constant
  # hover_thrust, level). There is no pilot input device.
  initial_mode: position_hold
  hover_thrust_n: 0.66708          # m * g
  # Yaw setpoint = heading at start (heading hold). false = always north
  # (kwad.cpp psi_des = 0); identical when the vehicle starts facing north.
  hold_initial_heading: true
  position_hold_target_enu_m: {x: 1.0, y: 1.0, z: 1.0}

reference_state_clamps:            # reference integrator only
  body_rate_rad_s: {roll: 0.87266, pitch: 0.87266, yaw: 0.87266}
  attitude_rad: {roll: 0.7853, pitch: 0.7853, yaw: 10.0}

# Close-enough effects (docs/pluto_x_parameters.md §7). Set enabled: false
# (or 0) to remove an effect; all values are estimates.
battery:
  enabled: true
  capacity_mah: 600.0              # [SRC] Drona store
  initial_state_of_charge: 1.0
  internal_resistance_ohm: 0.08    # [EST] 1S 600 mAh 20C cell + wiring
  reference_voltage_v: 3.7         # [EST] voltage at which rotor thrust is defined
  hover_current_a: 3.2             # [EST] 80 % of 600 mAh over the ~9 min
                                   #       flight time [SRC]
  open_circuit_voltage:            # [EST] typical LiPo curve [soc, V]
    - [0.00, 3.30]
    - [0.05, 3.50]
    - [0.10, 3.60]
    - [0.20, 3.70]
    - [0.40, 3.77]
    - [0.60, 3.85]
    - [0.80, 3.97]
    - [0.90, 4.07]
    - [1.00, 4.20]
latency:
  command_s: 0.05                  # [EST] Wi-Fi MSP link; measure on hardware
state_error:                       # stand-in for the MagisV2 estimator
  enabled: true
  seed: 1
  attitude_bias_std_rad: 0.0175    # [EST] ~1 deg level-trim error per axis
  attitude_noise_std_rad: 0.0017   # [EST] ~0.1 deg estimator noise
  gyro_bias_std_rad_s: 0.00087     # [EST] 0.05 deg/s residual after calibration
  gyro_noise_std_rad_s: 0.0018     # [SRC] ICM-20948 0.015 dps/sqrt(Hz) x [EST] 50 Hz bandwidth
wind:
  enabled: true
  seed: 2
  mean_enu_m_s: {x: 0.0, y: 0.0, z: 0.0}
  gust_std_m_s: 0.15               # [EST] light gusts (reduced from 0.3 on 2026-09-25 to ease controller development)
  gust_time_constant_s: 2.0        # [EST]

# Flight controller flying the vehicle.
#   magisv2: the production MagisV2 firmware (firmware/magisv2) on the
#            simulated sensors below, commanded by RC frames on /pluto/rc.
#   legacy:  the kwad.cpp cascade (controller/pilot/state_error sections);
#            ignores RC. Used by the legacy validation scripts.
# The launch argument flight_controller overrides `type`.
flight_controller:
  type: magisv2
  magisv2:
    busy_loop_period_us: 100       # [EST] MCU busy-loop pass; firmware looptime 3500 us
    preload_mag_calibration: true  # as a Pluto X whose compass was calibrated once
    imu:                           # ICM-20948 as MagisV2 configures it
      seed: 3
      gyro_counts_per_deg_s: 16.4  # [SRC] GYRO_CONFIG_1 = 0x1F: +/-2000 dps (see docs)
      accel_counts_per_g: 4096     # [SRC] ACCEL_CONFIG = 0x35: +/-8 g
      gyro_range_deg_s: 2000       # [SRC]
      accel_range_g: 8             # [SRC]
      gyro_noise_std_deg_s: 0.1    # [SRC] 0.015 dps/sqrt(Hz) x [EST] 51 Hz DLPF
      accel_noise_std_mg: 1.0      # [SRC] 230 ug/sqrt(Hz); [EST] bandwidth (DLPF ~5.7 Hz -> ~0.7 mg; rounded up)
      gyro_bias_std_deg_s: 1.0     # [EST] removed by the firmware's boot calibration
      accel_bias_std_mg: 5.0       # [EST] residual after accelerometer calibration
    baro:                          # ICP-10111
      seed: 4
      sea_level_pressure_pa: 101325.0
      ground_altitude_msl_m: 505.0 # [EST] Hyderabad; set to the flying site
      temperature_c: 30.0          # [EST]
      noise_std_pa: 1.0            # [EST] datasheet: 0.4-1 Pa depending on mode
    magnetic_field_ned_ut: {north: 40.0, east: -0.3, down: 19.5}  # [EST] WMM, Hyderabad
    mag_counts_per_ut: 6.667       # [SRC] AK09916: 0.15 uT/LSB

# Forward camera (Gazebo camera sensor; read by the model xacro only):
# the Pluto WiFi Camera Module (add-on on the UniBus header). Supplier spec
# [SRC]: video 720p / 1080p, live Wi-Fi stream ~18 FPS (25 FPS recording to
# SD), 8 g with casing, min supply 3.4 V. With the module fitted, the drone's
# own Wi-Fi is off and control/telemetry go through the camera's Wi-Fi.
# Not specified: field of view, mounting, compression latency [EST].
# The simulator publishes raw RGB frames (no H.264, no link latency).
camera:
  enabled: true
  topic: /pluto/camera/image_raw     # camera_info on /pluto/camera/camera_info
  width_px: 1280                     # [SRC] 720p live stream
  height_px: 720                     # [SRC]
  horizontal_fov_deg: 80.0           # [EST] not in the spec; measure
  rate_hz: 18.0                      # [SRC] ~18 FPS over Wi-Fi
  clip_near_m: 0.005                 # the lens is ~5 mm above the ground on the pad
  clip_far_m: 30.0
  noise_std: 0.007                   # [EST] pixel noise, fraction of full scale
  # mount in the body FLU frame: forward of the CoM, tilt + = pitched DOWN
  position_flu_m: {x: 0.035, y: 0.0, z: -0.018}  # [EST] under the front of the body (Pluto X
                                     #   camera module hangs below the drone); above
                                     #   the collision-box bottom (-0.0225) so the lens
                                     #   stays above ground on the pad
  tilt_down_deg: 0.0                 # [EST]

# Visuals: the legacy meshes (motors and guards at +-46 mm, as the physics),
# with each propeller drawn as its 55 mm disc. Collision box = the measured
# visual envelope (153 x 153 x 47 mm; published 16 x 16 x 4 cm).
gazebo_model:
  collision_box_m: {x: 0.15, y: 0.15, z: 0.045}
  visual_offset_z_m: -0.02
  spawn_height_m: 0.025
