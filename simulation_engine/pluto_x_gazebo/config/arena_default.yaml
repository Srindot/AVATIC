# AVATIC balloon arena (read by the ArenaSystem world plugin).
#
# World ENU metres, origin = the vehicle's take-off point (the vehicle spawns
# at the origin facing +x = east). Balloon positions are balloon CENTRES.
# Balloons are upright and visual-only (no collision): a balloon pops the
# first time the vehicle's contact sphere touches its surface.

time_limit_s: 15.0
# When the run clock starts:
#   sim_start  at simulation time 0 (the firmware's ~4 s start-up and the
#              take-off count against the limit)
#   armed      when the flight controller first reports ARMED
clock_start: sim_start
# Pause the simulation when the time limit is reached.
pause_on_time_limit: true

vehicle:
  model: pluto_x
  link: base_link
  # Contact outline that pops a balloon: spheres in the vehicle body frame
  # (FLU, origin = CoM), moving and rotating with it. Fitted to the model's
  # measured visual envelope, 153 x 153 x 47 mm (published: 16 x 16 x 4 cm):
  #   guards   55 mm props in 59 mm rings centred at (+-47.5, +-47.5) mm:
  #            r = 30 mm reaches the 77 mm half-width
  #   body     96 x 96 x 30 mm centre
  #   camera   8 g module below the body, towards the front (as the
  #            vehicle's camera mount, position_flu 0.035, 0, -0.018) [EST]
  # The spheres overstate the guards' thickness (+-30 mm vs +-12 mm).
  contact_spheres:
    - {position_flu_m: [ 0.0475,  0.0475, 0.0], radius_m: 0.030}
    - {position_flu_m: [ 0.0475, -0.0475, 0.0], radius_m: 0.030}
    - {position_flu_m: [-0.0475,  0.0475, 0.0], radius_m: 0.030}
    - {position_flu_m: [-0.0475, -0.0475, 0.0], radius_m: 0.030}
    - {position_flu_m: [ 0.0,     0.0,    0.005], radius_m: 0.030}
    - {position_flu_m: [ 0.035,   0.0,   -0.018], radius_m: 0.015}

balloon:
  # [ASSUMPTION] a standard 12-inch party balloon. The mesh
  # (models/balloon/meshes/balloon.stl)
  # has no units; it is scaled to this maximum width. Height = 1.5 x width.
  diameter_m: 0.30

colors:
  red:    {points: -75, rgba: [0.85, 0.05, 0.05, 1.0]}   # PENALTY: do not pop
  yellow: {points: 25,  rgba: [0.95, 0.80, 0.05, 1.0]}
  blue:   {points: 50,  rgba: [0.05, 0.25, 0.90, 1.0]}
  green:  {points: 100, rgba: [0.05, 0.65, 0.10, 1.0]}

# Two of each colour, spread around the take-off point at different
# distances, bearings and heights. Red balloons are PENALTIES (-75): they
# are obstacles to avoid. Best achievable score: 350. Higher-value
# balloons are farther and
# higher. Several are behind the start heading, so a yaw scan is needed.
balloons:
  - {color: yellow, position_enu_m: [ 1.5,  0.5, 1.0]}
  - {color: yellow, position_enu_m: [-1.2,  1.0, 0.9]}
  - {color: blue,   position_enu_m: [ 2.2, -1.2, 1.3]}
  - {color: blue,   position_enu_m: [-0.8, -2.0, 1.1]}
  - {color: red,    position_enu_m: [ 0.5,  2.8, 1.4]}
  - {color: red,    position_enu_m: [-2.8, -0.6, 1.5]}
  - {color: green,  position_enu_m: [ 3.6,  1.8, 1.8]}
  - {color: green,  position_enu_m: [-2.4, -3.0, 1.9]}
